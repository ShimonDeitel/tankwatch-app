name: Tankwatch
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: W7Q885Q59C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Tankwatch:
    type: application
    platform: iOS
    sources:
      - path: Tankwatch
    resources:
      - path: Tankwatch/Assets.xcassets
      - path: Tankwatch/Preview Content
      - path: Config/StoreKit/Tankwatch.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.tankwatch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tankwatch"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Tankwatch can remind you about upgrading to Pro after you use up your free monthly logs."
    entitlements:
      path: Tankwatch/Tankwatch.entitlements
      properties: {}
    info:
      path: Tankwatch/Info.plist
      properties:
        UILaunchScreen: {}
        NSUserNotificationsUsageDescription: "Tankwatch can remind you about upgrading to Pro after you use up your free monthly logs."

  TankwatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TankwatchTests
    dependencies:
      - target: Tankwatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.tankwatch.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - Tankwatch

schemes:
  Tankwatch:
    build:
      targets:
        Tankwatch: all
        TankwatchTests: [test]
    test:
      targets:
        - TankwatchTests
